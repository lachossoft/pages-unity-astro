<svg class="w-full h-auto" height="100%" viewBox="0 0 800 360" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Gradients -->
<linearGradient id="satGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#1E293B"></stop>
<stop offset="100%" stop-color="#0F172A"></stop>
</linearGradient>
<linearGradient id="unityGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#8B5CF6"></stop>
<stop offset="100%" stop-color="#6D28D9"></stop>
</linearGradient>
<linearGradient id="addGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#0284C7"></stop>
<stop offset="100%" stop-color="#0369A1"></stop>
</linearGradient>
<linearGradient id="beamGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"></stop>
<stop offset="50%" stop-color="#A78BFA" stop-opacity="0.8"></stop>
<stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"></stop>
</linearGradient>
<!-- Filters for Glow -->
<filter height="140%" id="purpleGlow" width="140%" x="-20%" y="-20%">
<feGaussianBlur result="blur" stdDeviation="8"></feGaussianBlur>
<feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
</filter>
<filter height="120%" id="softShadow" width="120%" x="-10%" y="-10%">
<feDropShadow dx="0" dy="8" flood-opacity="0.15" stdDeviation="6"></feDropShadow>
</filter>
<style>
      @keyframes floatSAT {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatCore {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-4px) scale(1.02); }
      }
      @keyframes floatADD {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseRing {
        0% { r: 52px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 76px; opacity: 0; stroke-width: 1px; }
      }
      @keyframes packetSATtoUnity {
        0% { transform: translate(160px, 170px); opacity: 0; }
        15% { opacity: 1; }
        45% { opacity: 1; }
        50% { transform: translate(380px, 170px); opacity: 0; }
        100% { transform: translate(380px, 170px); opacity: 0; }
      }
      @keyframes packetUnitytoADD {
        0% { transform: translate(420px, 170px); opacity: 0; }
        50% { transform: translate(420px, 170px); opacity: 0; }
        60% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(640px, 170px); opacity: 0; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes syncSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes successBadge {
        0%, 80% { opacity: 0.7; transform: scale(0.95); }
        90%, 100% { opacity: 1; transform: scale(1.05); }
      }

      .sat-box { animation: floatSAT 4s ease-in-out infinite; }
      .core-box { animation: floatCore 4s ease-in-out infinite 0.5s; }
      .add-box { animation: floatADD 4s ease-in-out infinite 1s; }
      .pulse-circle { animation: pulseRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .stream-path { stroke-dasharray: 8 6; animation: dashMove 1.2s linear infinite; }
      .stream-path-rev { stroke-dasharray: 8 6; animation: dashMove 1.2s linear infinite reverse; }
      .pkt-sat { animation: packetSATtoUnity 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .pkt-sat-2 { animation: packetSATtoUnity 3s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.2s; }
      .pkt-add { animation: packetUnitytoADD 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .pkt-add-2 { animation: packetUnitytoADD 3s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.2s; }
      .spin-icon { transform-origin: 400px 170px; animation: syncSpin 6s linear infinite; }
    </style>
</defs>
<!-- Background decorative grid / dots -->
<g opacity="0.12">
<circle cx="100" cy="60" fill="#7C3AED" r="1.5"></circle>
<circle cx="200" cy="60" fill="#7C3AED" r="1.5"></circle>
<circle cx="300" cy="60" fill="#7C3AED" r="1.5"></circle>
<circle cx="400" cy="60" fill="#7C3AED" r="1.5"></circle>
<circle cx="500" cy="60" fill="#7C3AED" r="1.5"></circle>
<circle cx="600" cy="60" fill="#7C3AED" r="1.5"></circle>
<circle cx="700" cy="60" fill="#7C3AED" r="1.5"></circle>
<circle cx="100" cy="300" fill="#7C3AED" r="1.5"></circle>
<circle cx="200" cy="300" fill="#7C3AED" r="1.5"></circle>
<circle cx="300" cy="300" fill="#7C3AED" r="1.5"></circle>
<circle cx="400" cy="300" fill="#7C3AED" r="1.5"></circle>
<circle cx="500" cy="300" fill="#7C3AED" r="1.5"></circle>
<circle cx="600" cy="300" fill="#7C3AED" r="1.5"></circle>
<circle cx="700" cy="300" fill="#7C3AED" r="1.5"></circle>
</g>
<!-- Connecting Stream Lines -->
<!-- Connection 1: SAT to Unity -->
<line stroke="#CBD5E1" stroke-linecap="round" stroke-width="4" x1="160" x2="400" y1="170" y2="170"></line>
<line class="stream-path" stroke="#8B5CF6" stroke-linecap="round" stroke-width="3" x1="160" x2="400" y1="170" y2="170"></line>
<!-- Connection 2: Unity to ADD CONTPAQi -->
<line stroke="#CBD5E1" stroke-linecap="round" stroke-width="4" x1="400" x2="640" y1="170" y2="170"></line>
<line class="stream-path" stroke="#0284C7" stroke-linecap="round" stroke-width="3" x1="400" x2="640" y1="170" y2="170"></line>
<!-- STEP 1: SAT PORTAL (Origen) -->
<g class="sat-box" filter="url(#softShadow)" transform-origin="120 170">
<rect fill="#FFFFFF" height="150" rx="16" stroke="#E2E8F0" stroke-width="1.5" width="140" x="50" y="95"></rect>
<rect fill="url(#satGrad)" height="42" rx="16" width="140" x="50" y="95"></rect>
<rect fill="url(#satGrad)" height="12" width="140" x="50" y="125"></rect>
<!-- Portal SAT Label -->
<text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle" x="120" y="121">PORTAL SAT</text>
<!-- Cloud & Document Icon -->
<g transform="translate(100, 150)">
<rect fill="#F1F5F9" height="46" rx="4" stroke="#94A3B8" stroke-width="1.5" width="36" x="2" y="2"></rect>
<line stroke="#64748B" stroke-linecap="round" stroke-width="2" x1="8" x2="24" y1="12" y2="12"></line>
<line stroke="#94A3B8" stroke-linecap="round" stroke-width="2" x1="8" x2="32" y1="20" y2="20"></line>
<line stroke="#94A3B8" stroke-linecap="round" stroke-width="2" x1="8" x2="28" y1="28" y2="28"></line>
<circle cx="28" cy="38" fill="#10B981" r="8"></circle>
<path d="M25 38 L27 40 L31 36" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</g>
<text fill="#475569" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle" x="120" y="222">CFDI 4.0 / Retenciones</text>
<text fill="#94A3B8" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" x="120" y="235">Descarga Automática</text>
</g>
<!-- STEP 2: UNITY ENGINE (Centro de Sincronización Inteligente) -->
<!-- Outer pulse ring -->
<circle class="pulse-circle" cx="400" cy="170" fill="none" r="60" stroke="#8B5CF6"></circle>
<g class="core-box" filter="url(#purpleGlow)" transform-origin="400 170">
<circle cx="400" cy="170" fill="url(#unityGrad)" r="54"></circle>
<circle cx="400" cy="170" fill="none" opacity="0.6" r="52" stroke="#C4B5FD" stroke-width="2"></circle>
<!-- Rotating Sync Orbit -->
<g class="spin-icon">
<circle cx="400" cy="128" fill="#F5F3FF" r="5"></circle>
<circle cx="400" cy="212" fill="#38BDF8" r="5"></circle>
</g>
<!-- Unity Icon / Logo Mark in Center -->
<text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5" text-anchor="middle" x="400" y="165">UNITY</text>
<text fill="#DDD6FE" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="400" y="180">CFDI</text>
<!-- Badge below core -->
<rect fill="#FFFFFF" filter="url(#softShadow)" height="28" rx="14" stroke="#DDD6FE" stroke-width="1.5" width="140" x="330" y="240"></rect>
<circle cx="346" cy="254" fill="#10B981" r="5"></circle>
<text fill="#5B21B6" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="406" y="258">Motor Desatendido</text>
</g>
<!-- STEP 3: BASE DE DATOS ADD - CONTPAQi (Destino) -->
<g class="add-box" filter="url(#softShadow)" transform-origin="680 170">
<rect fill="#FFFFFF" height="150" rx="16" stroke="#E2E8F0" stroke-width="1.5" width="140" x="610" y="95"></rect>
<rect fill="url(#addGrad)" height="42" rx="16" width="140" x="610" y="95"></rect>
<rect fill="url(#addGrad)" height="12" width="140" x="610" y="125"></rect>
<!-- ADD Label -->
<text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle" x="680" y="121">BD ADD / SQL</text>
<!-- Database Stack Icon -->
<g transform="translate(658, 148)">
<ellipse cx="22" cy="10" fill="#E0F2FE" rx="22" ry="7" stroke="#0284C7" stroke-width="1.5"></ellipse>
<path d="M0 10 v12 c0 4 10 7 22 7 s22 -3 22 -7 v-12" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"></path>
<path d="M0 22 v12 c0 4 10 7 22 7 s22 -3 22 -7 v-12" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"></path>
<ellipse cx="22" cy="10" fill="#38BDF8" opacity="0.4" rx="14" ry="4"></ellipse>
</g>
<text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="680" y="222">CONTPAQi® ADD</text>
<text fill="#64748B" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" x="680" y="235">Sincronizado &amp; Validado</text>
</g>
<!-- MOVING PACKETS / CFDI XML FLOW -->
<!-- SAT to Unity Packet 1 -->
<g class="pkt-sat">
<rect fill="#8B5CF6" filter="url(#softShadow)" height="28" rx="6" width="32" x="-16" y="-14"></rect>
<text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle" x="0" y="2">&lt;XML&gt;</text>
<circle cx="10" cy="-8" fill="#34D399" r="4" stroke="#FFFFFF" stroke-width="1"></circle>
</g>
<!-- SAT to Unity Packet 2 (Delayed) -->
<g class="pkt-sat-2">
<rect fill="#7C3AED" filter="url(#softShadow)" height="26" rx="5" width="30" x="-15" y="-13"></rect>
<text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle" x="0" y="1">32-D</text>
</g>
<!-- Unity to ADD Packet 1 -->
<g class="pkt-add">
<rect fill="#0284C7" filter="url(#softShadow)" height="28" rx="6" width="36" x="-18" y="-14"></rect>
<text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" x="0" y="2">SQL/ADD</text>
<path d="M-6 8 L6 8" stroke="#38BDF8" stroke-linecap="round" stroke-width="1.5"></path>
</g>
<!-- Unity to ADD Packet 2 (Delayed) -->
<g class="pkt-add-2">
<rect fill="#0369A1" filter="url(#softShadow)" height="26" rx="5" width="32" x="-16" y="-13"></rect>
<text fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle" x="0" y="1">CIF/ADD</text>
</g>
<!-- Bottom workflow status pill -->
<g transform="translate(240, 310)">
<rect fill="#F8FAFC" height="32" rx="16" stroke="#E2E8F0" stroke-width="1" width="320" x="0" y="0"></rect>
<circle cx="20" cy="16" fill="#10B981" r="4">
<animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"></animate>
</circle>
<text fill="#334155" font-family="Inter, sans-serif" font-size="11" font-weight="600" x="36" y="20">Sincronización desatendida 24/7 sin intervención</text>
</g>
</svg>